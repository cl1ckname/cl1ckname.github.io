name: Build
run-name: ${{ gitea.actor }} is cooking
on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build app
        run: docker build -t registery.toadonload.ru/garden:latest .
      - name: Push registry
        run: docker push registery.toadonload.ru/garden:latest

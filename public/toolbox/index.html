<link rel="stylesheet" href="toolbox/styles.css">
<script src="toolbox/script.js"></script>
<h1>Clickname's toolbox</h1>
<div class="converters">
	<fieldset class="encoding-converter">
		<legend>Encoding Converter</legend>
		<div class="encoding-converter-column">
			<div class="encoding-converter-controls"><select id="left-encoding-select">
					<option value="utf8" selected="selected">utf8
					<option value="hex">hex
					<option value="base64">base64
				</select> <button type="button" id="left-encoding-copy-btn">Copy</button></div><textarea
				id="left-encoding-textarea"></textarea>
		</div>
		<div class="encoding-converter-column">
			<div class="encoding-converter-controls"><select id="right-encoding-select">
					<option value="utf8">utf8
					<option value="hex" selected="selected">hex
					<option value="base64">base64
				</select> <button type="button" id="right-encoding-copy-btn">Copy</button></div><textarea
				id="right-encoding-textarea"></textarea>
		</div>
	</fieldset>
	<fieldset class="unit-converter">
		<legend>Unit converter</legend>
		<div class="unit-converter-field"><button type="button" id="wei-copy-btn">Copy</button> <input id="wei-input"
				inputmode="decimal"> <label>Wei (10<sup>-18</sup>)</label></div>
		<div class="unit-converter-field"><button type="button" id="gwei-copy-btn">Copy</button> <input id="gwei-input"
				inputmode="decimal"> <label>Gwei (10<sup>-9</sup>)</label></div>
		<div class="unit-converter-field"><button type="button" id="eth-copy-btn">Copy</button> <input id="eth-input"
				inputmode="decimal"> <label>Eth (1)</label></div>
	</fieldset>
	<fieldset class="number-base-converter">
		<legend>Number Base Converter</legend>
		<div class="number-base-converter-row">
			<div class="number-base-converter-controls"><select id="top-base-select">
					<option value="bin">bin
					<option value="oct">oct
					<option value="dec" selected="selected">dec
					<option value="hex">hex
				</select> <button type="button" id="top-base-copy-btn">Copy</button></div><input id="top-base-input">
		</div>
		<div class="number-base-converter-row">
			<div class="number-base-converter-controls"><select id="bottom-base-select">
					<option value="bin">bin
					<option value="oct">oct
					<option value="dec">dec
					<option value="hex" selected="selected">hex
				</select> <button type="button" id="bottom-base-copy-btn">Copy</button></div><input
				id="bottom-base-input">
		</div>
	</fieldset>
	<fieldset class="ecdsa-converter">
		<legend>ECDSA Pubkey to address</legend>
		<div class="ecdsa-converter-row"><input placeholder="compressed public key (hex)" id="compressed-pubkey-input">
			<button type="button" id="compressed-pubkey-copy-btn">Copy</button></div>
		<div class="ecdsa-converter-row"><input placeholder="uncompressed public key (hex)"
				id="uncompressed-pubkey-input"> <button type="button" id="uncompressed-pubkey-copy-btn">Copy</button>
		</div>
		<div class="ecdsa-converter-error" id="ecdsa-converter-error" style="display:none"></div>
		<div class="ecdsa-converter-row"><input readonly="readonly" id="addr-eth-input"> <button type="button"
				id="addr-eth-copy-btn">Copy</button></div>
		<div class="ecdsa-converter-row"><input readonly="readonly" id="addr-tron-input"> <button type="button"
				id="addr-tron-copy-btn">Copy</button></div>
		<div class="ecdsa-converter-row"><input readonly="readonly" id="addr-btc-input"> <button type="button"
				id="addr-btc-copy-btn">Copy</button></div>
	</fieldset>
	<fieldset class="priv-to-pub">
		<legend>Private → Compressed Public Key</legend>
		<div class="priv-to-pub-row"><input placeholder="Private key (hex)" id="priv-key-input"> <button type="button"
				id="priv-key-random-btn">Random</button></div>
		<div class="priv-to-pub-error" id="priv-to-pub-error" style="display:none"></div>
		<div class="priv-to-pub-row"><input readonly="readonly" id="pub-key-input"> <button type="button"
				id="pub-key-copy-btn">Copy</button></div>
	</fieldset>
	<fieldset class="image-format-converter">
		<legend>Image Format Converter</legend><input type="file" id="image-file-input"
			accept="image/png,image/jpeg,image/webp">
		<div class="image-format-converter-preview-container" id="image-preview-container">
			<div class="image-format-converter-preview-placeholder"></div>
		</div>
		<div class="image-format-converter-controls"><select id="image-target-format">
				<option value="png">png
				<option value="jpg">jpg
				<option value="webp">webp
			</select> <button type="button" id="image-download-btn" disabled="disabled">Download</button></div><canvas
			id="image-converter-canvas" hidden></canvas>
	</fieldset>
	<fieldset class="unix-converter">
		<legend>Unix Time Converter</legend>
		<div class="unix-converter-row"><input type="number" id="unix-time-input"> <button type="button"
				id="unix-time-copy-btn">Copy</button></div>
		<div class="unix-converter-row"><input readonly="readonly" id="unix-date-output"></div>
	</fieldset>
	<fieldset class="random-generator">
		<legend>Random Data Generator</legend>
		<div class="random-generator-row"><input id="uuid-input" readonly="readonly"> <button type="button"
				class="copy-btn" data-target="uuid-input">Copy</button></div>
		<div class="random-generator-row"><input id="number-input" readonly="readonly"> <button type="button"
				class="copy-btn" data-target="number-input">Copy</button></div>
		<div class="random-generator-row"><input id="color-input" readonly="readonly"> <button type="button"
				class="copy-btn" data-target="color-input">Copy</button></div><button type="button"
			id="regenerate-btn">Regenerate</button>
	</fieldset>
	<fieldset class="color-converter">
		<legend>Color Converter</legend>
		<div class="color-converter-row-wrapper">
			<div class="color-converter-preview" id="color-converter-preview"></div>
			<div class="color-converter-fields">
				<div class="color-converter-row"><label>HEX:</label> <input id="hex-input"></div>
				<div class="color-converter-row"><label>RGB:</label> <input id="rgb-input"></div>
				<div class="color-converter-row"><label>HSV:</label> <input id="hsv-input"></div>
			</div>
		</div>
	</fieldset>
</div>
<script href="script.js">
